modules:
  http_2xx:
    prober: http
    timeout: 2s
    http:
      method: GET
      follow_redirects: true
      preferred_ip_protocol: ip4

  tcp_connect:
    prober: tcp
    timeout: 2s

  dns:
    prober: dns
    timeout: 2s
    dns:
      transport_protocol: udp
      query_type: A
      query_name: mfu.ac.th

  icmp:
    prober: icmp
    timeout: 2s
    icmp:
      preferred_ip_protocol: "ip4"